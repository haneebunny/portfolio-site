<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f4f8f5 0%, #eef4ef 100%);
    color: #1F3A2B;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(244, 248, 245, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(76, 138, 100, 0.15);
  }
  header .brand {
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #2E4A38;
    font-size: 17px;
  }
  header .brand span {
    color: #4C8A64;
    font-weight: 500;
  }
  header a.dl {
    font-size: 13px;
    color: #fff;
    background: #4C8A64;
    padding: 9px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(76, 138, 100, 0.25);
    transition: all .2s ease;
  }
  header a.dl:hover {
    background: #3d7352;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(76, 138, 100, 0.35);
  }
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 24px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .page-card {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(31, 58, 43, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    background: #fff;
    line-height: 0;
  }
  .page-card img {
    width: 100%;
    height: auto;
    display: block;
  }
  
  /* Link Overlays with new tab target */
  .link-overlay {
    position: absolute;
    display: block;
    cursor: pointer;
    border-radius: 6px;
    background: rgba(76, 138, 100, 0.05);
    border: 1.5px dashed rgba(76, 138, 100, 0.35);
    transition: all 0.2s ease;
  }
  .link-overlay:hover {
    background: rgba(76, 138, 100, 0.18);
    border-color: #4C8A64;
    box-shadow: 0 0 12px rgba(76, 138, 100, 0.3);
    transform: scale(1.01);
  }

  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: #5E7266;
    font-size: 13px;
  }
</style>
