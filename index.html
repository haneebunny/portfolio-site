<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f4f8f5 0%, #eef4ef 100%);
    color: #1F3A2B;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(244, 248, 245, 0.9);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(76, 138, 100, 0.15);
  }
  header .brand {
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #2E4A38;
    font-size: 16px;
  }
  header .brand span {
    color: #4C8A64;
  }
  header a.dl {
    font-size: 13px;
    color: #fff;
    background: #4C8A64;
    padding: 8px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 600;
    transition: background .2s;
  }
  header a.dl:hover { background: #3d7352; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .page {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(31, 58, 43, 0.12);
    background: #fff;
    line-height: 0;
  }
  .page img {
    width: 100%;
    height: auto;
    display: block;
  }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: #5E7266;
    font-size: 13px;
  }
  footer a { color: #4C8A64; }
</style>
