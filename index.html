<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신하니 포트폴리오</title>
<meta name="description" content="신하니 PM 포트폴리오 - 모두의 외근, PAWINMATCH">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f4f8f5 0%, #eef4ef 100%);
    color: #1F3A2B;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(244, 248, 245, 0.92);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(76, 138, 100, 0.15);
  }
  header .brand {
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #2E4A38;
    font-size: 16px;
  }
  header .brand span {
    color: #4C8A64;
  }
  header a.dl {
    font-size: 13px;
    color: #fff;
    background: #4C8A64;
    padding: 8px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 600;
    transition: background .2s;
  }
  header a.dl:hover { background: #3d7352; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .pdf-page-wrapper {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(31, 58, 43, 0.12);
    background: #fff;
  }
  .pdf-page-wrapper canvas {
    width: 100% !important;
    height: auto !important;
    display: block;
  }
  /* Overlay layer for clickable PDF links */
  .link-overlay-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .pdf-link-overlay {
    pointer-events: auto;
    display: block;
    cursor: pointer;
    border: 1px dashed transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .pdf-link-overlay:hover {
    background: rgba(76, 138, 100, 0.15);
    border-color: rgba(76, 138, 100, 0.5);
    border-radius: 4px;
  }
  .loading-box {
    text-align: center;
    padding: 60px 20px;
    color: #4C8A64;
    font-weight: 600;
    font-size: 15px;
  }
  .native-embed {
    width: 100%;
    height: 85vh;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(31, 58, 43, 0.12);
  }
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    color: #5E7266;
    font-size: 13px;
  }
  footer a { color: #4C8A64; }
</style>
</head>
<body>
<header>
  <div class="brand">신하니 <span>portfolio</span></div>
  <a class="dl" href="portfolio.pdf" download>PDF 다운로드</a>
</header>

<main id="pdf-viewer">
  <div class="loading-box">포트폴리오 PDF 및 링크를 불러오는 중입니다...</div>
</main>

<footer>
  신하니 &middot; re____@naver.com
</footer>

<script src="./pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
  }

  const container = document.getElementById('pdf-viewer');

  function loadNativeFallback() {
    container.innerHTML = `
      <object data="portfolio.pdf#toolbar=1" type="application/pdf" class="native-embed">
        <iframe src="portfolio.pdf" class="native-embed">
          <div class="loading-box">
            PDF를 뷰어로 불러올 수 없습니다.<br><br>
            <a class="dl" href="portfolio.pdf" download>PDF 파일 다운로드하기</a>
          </div>
        </iframe>
      </object>
    `;
  }

  if (typeof pdfjsLib === 'undefined') {
    loadNativeFallback();
  } else {
    pdfjsLib.getDocument('./portfolio.pdf').promise.then(async function(pdf) {
      container.innerHTML = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        
        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';
        
        const viewport = page.getViewport({ scale: 2.0 });
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        pageWrapper.appendChild(canvas);

        const linkLayerDiv = document.createElement('div');
        linkLayerDiv.className = 'link-overlay-layer';
        pageWrapper.appendChild(linkLayerDiv);

        container.appendChild(pageWrapper);

        // Render Canvas
        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        // Render Links dynamically
        try {
          const annotations = await page.getAnnotations();
          if (annotations && annotations.length > 0) {
            annotations.forEach(annot => {
              const url = annot.url || annot.unsafeUrl;
              if (annot.subtype === 'Link' && url) {
                const rect = viewport.convertToViewportRectangle(annot.rect);
                const left = Math.min(rect[0], rect[2]);
                const top = Math.min(rect[1], rect[3]);
                const width = Math.abs(rect[2] - rect[0]);
                const height = Math.abs(rect[3] - rect[1]);

                const linkEl = document.createElement('a');
                linkEl.href = url;
                linkEl.target = '_blank';
                linkEl.rel = 'noopener noreferrer';
                linkEl.style.position = 'absolute';
                linkEl.style.left = (left / viewport.width * 100) + '%';
                linkEl.style.top = (top / viewport.height * 100) + '%';
                linkEl.style.width = (width / viewport.width * 100) + '%';
                linkEl.style.height = (height / viewport.height * 100) + '%';
                linkEl.className = 'pdf-link-overlay';
                
                linkLayerDiv.appendChild(linkEl);
              }
            });
          }
        } catch (linkErr) {
          console.warn('링크 오버레이 생성 경고:', linkErr);
        }
      }
    }).catch(function(error) {
      console.error('PDF.js 로드 오류:', error);
      loadNativeFallback();
    });
  }
</script>
</body>
</html>
